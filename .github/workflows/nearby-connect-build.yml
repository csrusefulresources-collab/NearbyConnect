name: Nearby Connect - Pinned Gradle 8.13 Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nearby-connect-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Explicitly install Gradle 8.13. Do not use the runner system Gradle 9.x.
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Verify repository layout
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo 'Project files are in the repository root.'

      - name: Verify Java and pinned Gradle version
        shell: bash
        run: |
          set -euo pipefail
          java -version
          command -v gradle
          gradle --version
          ACTUAL_GRADLE="$(gradle --version | awk '/^Gradle / {print $2; exit}')"
          if [[ "$ACTUAL_GRADLE" != "8.13" ]]; then
            echo "ERROR: This build requires Gradle 8.13; found $ACTUAL_GRADLE"
            exit 1
          fi

      - name: Verify Android Gradle Plugin version
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'id("com.android.application") version "8.13.2" apply false' build.gradle.kts
          echo 'Android Gradle Plugin 8.13.2 found.'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK output
        if: success()
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NearbyConnect-v1.2.0-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NearbyConnect-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
